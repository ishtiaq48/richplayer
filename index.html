<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RichPlayer">
  <meta name="theme-color" content="#000000">
  <title>RichPlayer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="view"></main>

    <div id="mini" class="mini hidden">
      <img id="miniArt" class="art" alt="">
      <div class="mini-text"><div id="miniTitle" class="t1"></div><div id="miniArtist" class="t2"></div></div>
      <button class="icon-btn" data-action="toggle" aria-label="Play/Pause"><svg id="miniPlayIcon"><use href="#i-play"/></svg></button>
      <button class="icon-btn" data-action="next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
      <button class="icon-btn dim" data-action="close-player" aria-label="Close player"><svg class="sm"><use href="#i-x"/></svg></button>
      <div class="mini-progress"><div id="miniBar"></div></div>
    </div>

    <nav id="tabs" class="tabs">
      <button data-tab="library" class="active"><svg><use href="#i-home"/></svg><span>Library</span></button>
      <button data-tab="playlists"><svg><use href="#i-list"/></svg><span>Playlists</span></button>
      <button data-tab="settings"><svg><use href="#i-gear"/></svg><span>Settings</span></button>
    </nav>

    <section id="np" class="np hidden" aria-label="Now Playing">
      <div class="np-bg"><img id="npBg" alt=""></div>
      <div class="np-inner">
        <div class="np-top">
          <button class="icon-btn" data-action="close-np" aria-label="Close"><svg><use href="#i-down"/></svg></button>
          <span class="dim small">Now Playing</span>
          <button class="icon-btn" data-action="np-menu" aria-label="More"><svg><use href="#i-more"/></svg></button>
        </div>
        <div class="np-art-wrap"><img id="npArt" class="np-art" alt=""></div>
        <div class="np-info">
          <div class="np-titles"><div id="npTitle" class="np-title"></div><div id="npArtist" class="np-artist"></div></div>
          <button class="icon-btn" data-action="np-fav" aria-label="Favorite"><svg id="npFavIcon"><use href="#i-heart"/></svg></button>
        </div>
        <div class="np-seek">
          <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <div class="np-times"><span id="tCur">0:00</span><span id="tLeft">-0:00</span></div>
        </div>
        <div class="np-controls">
          <button class="icon-btn" data-action="shuffle" aria-label="Shuffle"><svg id="shuffleIcon"><use href="#i-shuffle"/></svg></button>
          <button class="icon-btn big" data-action="prev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
          <button class="play-btn" data-action="toggle" aria-label="Play/Pause"><svg id="npPlayIcon"><use href="#i-play"/></svg></button>
          <button class="icon-btn big" data-action="next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
          <button class="icon-btn" data-action="repeat" aria-label="Repeat"><svg id="repeatIcon"><use href="#i-repeat"/></svg></button>
        </div>
        <div class="np-extras">
          <button class="icon-btn" data-action="back10" aria-label="Back 10s"><svg><use href="#i-back10"/></svg></button>
          <button class="pill" data-action="speed" id="speedBtn">1x</button>
          <button class="icon-btn" data-action="eq" aria-label="Equalizer"><svg><use href="#i-eq"/></svg></button>
          <button class="icon-btn" data-action="sleep" aria-label="Sleep timer"><svg id="sleepIcon"><use href="#i-moon"/></svg></button>
          <button class="icon-btn" data-action="queue" aria-label="Queue"><svg><use href="#i-queue"/></svg></button>
          <button class="icon-btn" data-action="fwd10" aria-label="Forward 10s"><svg><use href="#i-fwd10"/></svg></button>
        </div>
      </div>
    </section>

    <div id="sheetBackdrop" class="backdrop hidden"></div>
    <div id="sheet" class="sheet hidden" role="dialog"></div>
    <div id="toast" class="toast hidden"></div>
    <input id="fileInput" type="file" multiple accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.aiff,.aif,.ogg,.opus" hidden>
  </div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z" fill="currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4.5" height="16" rx="1.2" fill="currentColor"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2" fill="currentColor"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M3 6.2v11.6a.8.8 0 0 0 1.2.7L12 13.4v4.4a.8.8 0 0 0 1.2.7l8.6-5.8a.8.8 0 0 0 0-1.4l-8.6-5.8A.8.8 0 0 0 12 6.2v4.4L4.2 5.5A.8.8 0 0 0 3 6.2z" fill="currentColor"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M21 6.2v11.6a.8.8 0 0 1-1.2.7L12 13.4v4.4a.8.8 0 0 1-1.2.7l-8.6-5.8a.8.8 0 0 1 0-1.4l8.6-5.8a.8.8 0 0 1 1.2.7v4.4l7.8-5.1a.8.8 0 0 1 1.2.7z" fill="currentColor"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h11M4 11h11M4 16h7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M18 8v8.5a2.5 2.5 0 1 1-2-2.45V8h4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 4.6.1-1.1-.1-1.1 2-1.6-2-3.4-2.4.9a8 8 0 0 0-1.9-1.1L15.7 3h-3.9l-.4 2.6a8 8 0 0 0-1.9 1.1L7.1 5.8l-2 3.4 2 1.6-.1 1.2.1 1.1-2 1.6 2 3.4 2.4-.9a8 8 0 0 0 1.9 1.1l.4 2.6h3.9l.4-2.6a8 8 0 0 0 1.9-1.1l2.4.9 2-3.4z" fill="currentColor" transform="translate(-1.3 -0.5) scale(1.05)"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.5 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.5 0 5.6 3.5 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.5 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.5 0 5.6 3.5 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" fill="currentColor"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.6l2.4 4.8c1.1 1.6 2.3 2.6 4.3 2.6H20M3 17h3.5c1.4 0 2.4-.5 3.2-1.3M14.3 8.3c.8-.8 1.8-1.3 3.2-1.3H20M17.5 4.5 20 7l-2.5 2.5M17.5 14.5 20 17l-2.5 2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h12M16 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H5M8 21l-3-3 3-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-repeat1" viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h12M16 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H5M8 21l-3-3 3-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.3 10.2 12.6 9.5V15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-back10" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4 3.5v4h4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="15.4" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" font-family="-apple-system,sans-serif">10</text></symbol>
      <symbol id="i-fwd10" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M20 3.5v4h-4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="15.4" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" font-family="-apple-system,sans-serif">10</text></symbol>
      <symbol id="i-eq" viewBox="0 0 24 24"><path d="M6 3v18M12 3v18M18 3v18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".45"/><rect x="3.5" y="13" width="5" height="3" rx="1.5" fill="currentColor"/><rect x="9.5" y="6" width="5" height="3" rx="1.5" fill="currentColor"/><rect x="15.5" y="10" width="5" height="3" rx="1.5" fill="currentColor"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-moon-fill" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/></symbol>
      <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 20 20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M3.5 16.5 7 20l3.5-3.5M17 20V4M13.5 7.5 17 4l3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5.5l11-2V16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.8" fill="currentColor"/><circle cx="17.5" cy="16" r="2.8" fill="currentColor"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 7V4.5h4V7M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-wave" viewBox="0 0 24 24"><path d="M4 10v4M8 6v12M12 9v6M16 4v16M20 10v4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <script src="tags.js"></script>
  <script src="app.js"></script>
</body>
</html>
